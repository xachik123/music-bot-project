services:
  - type: web
    name: music-bot-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash -c "uvicorn server:app --host 0.0.0.0 --port $PORT & python bot.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0